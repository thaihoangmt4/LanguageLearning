name: Backend Production CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  ci:
    name: Restore, build, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.100

      - name: Restore
        run: dotnet restore LanguageLearning.slnx

      - name: Build
        run: dotnet build LanguageLearning.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test LanguageLearning.WebApi.Tests/LanguageLearning.WebApi.Tests.csproj --configuration Release --no-build --no-restore

  publish:
    name: Build and publish ARM64 image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/language-learning-backend" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: LanguageLearning.WebApi/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production EC2
    needs:
      - ci
      - publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v6

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify assumed AWS identity
        run: aws sts get-caller-identity

      - name: Deploy current SHA with SSM and verify liveness
        shell: bash
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          BACKEND_IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          set -euo pipefail

          cat > deploy-backend.sh <<'REMOTE'
          #!/usr/bin/env bash
          set -euo pipefail

          readonly deployment_dir=/opt/language-learning-backend
          readonly backend_image="$1"
          readonly backend_image_tag="$2"
          readonly compose_base64="$3"
          readonly deployment_user=ubuntu
          compose_temp=""

          cleanup() {
            if [ -n "$compose_temp" ] && [ -f "$compose_temp" ]; then
              rm -f "$compose_temp"
            fi
          }
          trap cleanup EXIT

          run_as_deployment_user() {
            runuser -u "$deployment_user" -- bash -c \
              'set -euo pipefail; cd "$1"; shift; exec "$@"' \
              bash "$deployment_dir" "$@"
          }

          test -d "$deployment_dir"
          test -f "$deployment_dir/.env"

          compose_temp=$(mktemp "$deployment_dir/.docker-compose.prod.yml.XXXXXX")
          printf '%s' "$compose_base64" | base64 --decode > "$compose_temp"
          chown "$deployment_user:$deployment_user" "$compose_temp"
          chmod 0644 "$compose_temp"
          mv -f "$compose_temp" "$deployment_dir/docker-compose.prod.yml"
          compose_temp=""

          run_as_deployment_user env \
            BACKEND_IMAGE="$backend_image" BACKEND_IMAGE_TAG="$backend_image_tag" \
            docker compose -f docker-compose.prod.yml --env-file .env pull backend

          run_as_deployment_user env \
            BACKEND_IMAGE="$backend_image" BACKEND_IMAGE_TAG="$backend_image_tag" \
            docker compose -f docker-compose.prod.yml --env-file .env \
            up -d --no-deps backend

          run_as_deployment_user env \
            BACKEND_IMAGE="$backend_image" BACKEND_IMAGE_TAG="$backend_image_tag" \
            docker compose -f docker-compose.prod.yml --env-file .env ps

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5000/health/live > /dev/null; then
              echo "Backend liveness check passed."
              exit 0
            fi
            echo "Backend is not live yet (attempt ${attempt}/30)."
            sleep 5
          done

          echo "Backend liveness check failed after 30 attempts." >&2
          run_as_deployment_user env \
            BACKEND_IMAGE="$backend_image" BACKEND_IMAGE_TAG="$backend_image_tag" \
            docker compose -f docker-compose.prod.yml --env-file .env ps >&2
          run_as_deployment_user env \
            BACKEND_IMAGE="$backend_image" BACKEND_IMAGE_TAG="$backend_image_tag" \
            docker compose -f docker-compose.prod.yml --env-file .env \
            logs --tail 100 backend >&2
          exit 1
          REMOTE

          compose_base64=$(base64 --wrap=0 docker-compose.prod.yml)
          script_base64=$(base64 --wrap=0 deploy-backend.sh)
          remote_command=$(printf \
            "printf '%%s' '%s' | base64 --decode > /tmp/deploy-language-learning-backend.sh && chmod 0700 /tmp/deploy-language-learning-backend.sh && /tmp/deploy-language-learning-backend.sh '%s' '%s' '%s'; result=\$?; rm -f /tmp/deploy-language-learning-backend.sh; exit \$result" \
            "$script_base64" "$BACKEND_IMAGE" "$GITHUB_SHA" "$compose_base64")
          jq -n --arg command "$remote_command" '{commands: [$command]}' > ssm-parameters.json

          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy language-learning backend ${GITHUB_SHA}" \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)
          echo "SSM command submitted: $command_id"

          terminal_status=""
          for attempt in $(seq 1 60); do
            set +e
            invocation=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --output json 2>ssm-get-error.txt)
            get_status=$?
            set -e

            if [ "$get_status" -ne 0 ]; then
              echo "SSM invocation is not available yet (poll ${attempt}/60)."
              cat ssm-get-error.txt
              sleep 5
              continue
            fi

            status=$(jq -r '.Status' <<< "$invocation")
            echo "SSM invocation status: $status (poll ${attempt}/60)"
            case "$status" in
              Success)
                terminal_status="$status"
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated|InvalidPlatform|AccessDenied)
                terminal_status="$status"
                break
                ;;
              Pending|InProgress|Delayed)
                sleep 5
                ;;
              *)
                echo "Unexpected SSM invocation status: $status" >&2
                terminal_status="$status"
                break
                ;;
            esac
          done

          set +e
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --output json > ssm-final.json 2>ssm-final-error.txt
          final_get_status=$?
          set -e

          echo "===== Final SSM invocation ====="
          if [ "$final_get_status" -eq 0 ]; then
            final_status=$(jq -r '.Status' ssm-final.json)
            echo "Status: $final_status"
            echo "===== Remote stdout ====="
            jq -r '.StandardOutputContent // ""' ssm-final.json
            echo "===== Remote stderr =====" >&2
            jq -r '.StandardErrorContent // ""' ssm-final.json >&2
          else
            echo "Unable to retrieve the final SSM invocation." >&2
            cat ssm-final-error.txt >&2
            exit 1
          fi

          if [ "$terminal_status" != "Success" ] || [ "$final_status" != "Success" ]; then
            echo "Backend deployment failed with SSM status: $final_status" >&2
            exit 1
          fi
